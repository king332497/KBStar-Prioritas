<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxury Gold Glow Animation</title>
<style>
:root{
  --bg:#090806;
  --bg-2:#11100b;
  --gold:#f4c84a;
  --gold-2:#ffdf73;
  --gold-3:#b88618;
  --ink:#fff9df;
  --muted:#c9bea0;
  --line:rgba(255,220,116,.24);
  --glass:rgba(255,255,255,.055);
  --radius:28px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%, rgba(244,200,74,.14), transparent 34rem),
    linear-gradient(145deg,var(--bg),var(--bg-2) 54%,#070704);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:28px 16px;
  overflow-x:hidden;
}

.stage{
  width:min(1060px,100%);
  position:relative;
  isolation:isolate;
}

.ambient{
  position:absolute;
  inset:8% 12%;
  z-index:-2;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,207,77,.16),rgba(255,207,77,.03) 45%,transparent 72%);
  filter:blur(34px);
  animation:ambientPulse 6s ease-in-out infinite;
}

.card{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:clamp(28px,5vw,68px);
  background:
    linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025)),
    rgba(8,8,5,.78);
  box-shadow:
    0 30px 80px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,219,102,.03) inset,
    0 0 48px rgba(239,183,35,.07);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.card::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(
    115deg,
    transparent 12%,
    rgba(255,226,134,.16) 28%,
    rgba(255,232,151,.88) 48%,
    rgba(223,162,21,.28) 64%,
    transparent 82%
  );
  background-size:240% 100%;
  animation:borderShimmer 7s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}

.card::after{
  content:"";
  position:absolute;
  width:38%;
  height:190%;
  top:-45%;
  left:-50%;
  transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,241,192,.09),rgba(255,232,158,.2),rgba(255,255,255,.08),transparent);
  filter:blur(4px);
  animation:lightSweep 6.5s cubic-bezier(.2,.7,.2,1) infinite;
  pointer-events:none;
}

.kicker{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
  color:var(--gold-2);
  font-weight:700;
  font-size:.78rem;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.kicker-dot{
  width:8px;
  aspect-ratio:1;
  border-radius:50%;
  background:var(--gold);
  box-shadow:
    0 0 10px rgba(244,200,74,.9),
    0 0 24px rgba(244,200,74,.5);
  animation:dotPulse 2.4s ease-in-out infinite;
}

h1{
  margin:0;
  max-width:780px;
  font-size:clamp(2.2rem,6vw,5.7rem);
  line-height:.95;
  letter-spacing:-.055em;
  font-weight:780;
}

.gold-text{
  color:transparent;
  background:linear-gradient(100deg,#e3ad21,#fff1ad 32%,#f6c84d 53%,#fff3b8 70%,#b98013);
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  animation:textGoldFlow 7s linear infinite;
  filter:drop-shadow(0 0 16px rgba(244,200,74,.13));
}

.copy{
  max-width:660px;
  margin:22px 0 0;
  color:var(--muted);
  font-size:clamp(1rem,2vw,1.15rem);
  line-height:1.75;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-top:34px;
}

.lux-button{
  position:relative;
  isolation:isolate;
  border:0;
  border-radius:999px;
  min-height:54px;
  padding:0 26px;
  font:inherit;
  font-weight:800;
  letter-spacing:.01em;
  cursor:pointer;
  color:#171205;
  background:linear-gradient(110deg,#c7901d,#f8d65e 34%,#fff0a2 51%,#efbd37 70%,#b97912);
  background-size:220% 100%;
  box-shadow:
    0 10px 28px rgba(211,154,26,.23),
    0 0 18px rgba(255,208,74,.26),
    0 0 0 1px rgba(255,247,202,.6) inset;
  transition:transform .25s ease, box-shadow .25s ease;
  animation:
    buttonGoldFlow 5s linear infinite,
    luxuryGlow 3.6s ease-in-out infinite;
  overflow:hidden;
}

.lux-button::before{
  content:"";
  position:absolute;
  inset:-40% auto -40% -65%;
  width:46%;
  z-index:-1;
  transform:skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.82),transparent);
  animation:buttonSweep 3.8s ease-in-out infinite;
}

.lux-button:hover{
  transform:translateY(-2px) scale(1.012);
  box-shadow:
    0 15px 38px rgba(211,154,26,.32),
    0 0 26px rgba(255,208,74,.38),
    0 0 0 1px rgba(255,250,221,.8) inset;
}

.lux-button:active{transform:translateY(0) scale(.99)}

.ghost{
  min-height:54px;
  padding:0 25px;
  border-radius:999px;
  border:1px solid rgba(255,218,98,.25);
  background:rgba(255,255,255,.035);
  color:#f7edce;
  font:inherit;
  font-weight:700;
  backdrop-filter:blur(10px);
}

.logo-orb{
  position:absolute;
  right:clamp(24px,6vw,80px);
  top:clamp(24px,6vw,64px);
  width:clamp(64px,9vw,108px);
  aspect-ratio:1;
  display:grid;
  place-items:center;
  border-radius:26px;
  border:1px solid rgba(255,224,122,.35);
  background:linear-gradient(145deg,rgba(255,223,109,.11),rgba(255,255,255,.02));
  box-shadow:
    0 0 30px rgba(244,200,74,.16),
    inset 0 0 24px rgba(255,230,133,.045);
  animation:logoBreath 4.4s ease-in-out infinite;
}

.logo-orb span{
  font-size:clamp(1rem,2.5vw,1.55rem);
  font-weight:900;
  letter-spacing:-.05em;
  background:linear-gradient(110deg,#d99a18,#fff0a8,#f1bb35);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.particles{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.particle{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#ffe58e;
  box-shadow:0 0 10px rgba(255,220,116,.8);
  opacity:.0;
  animation:floatSpark 7s linear infinite;
}

.particle:nth-child(1){left:8%;bottom:8%;animation-delay:.2s}
.particle:nth-child(2){left:24%;bottom:2%;animation-delay:2.1s}
.particle:nth-child(3){left:55%;bottom:4%;animation-delay:3.6s}
.particle:nth-child(4){left:78%;bottom:9%;animation-delay:1.2s}
.particle:nth-child(5){left:92%;bottom:4%;animation-delay:4.4s}

@keyframes luxuryGlow{
  0%,100%{
    box-shadow:
      0 10px 28px rgba(211,154,26,.20),
      0 0 14px rgba(255,208,74,.22),
      0 0 0 1px rgba(255,247,202,.55) inset;
  }
  50%{
    box-shadow:
      0 14px 38px rgba(211,154,26,.28),
      0 0 30px rgba(255,208,74,.44),
      0 0 58px rgba(255,193,35,.18),
      0 0 0 1px rgba(255,250,221,.78) inset;
  }
}

@keyframes logoBreath{
  0%,100%{
    transform:translateY(0);
    box-shadow:0 0 26px rgba(244,200,74,.12),inset 0 0 22px rgba(255,230,133,.04);
  }
  50%{
    transform:translateY(-5px);
    box-shadow:0 0 40px rgba(244,200,74,.27),0 0 72px rgba(244,200,74,.08),inset 0 0 28px rgba(255,230,133,.07);
  }
}

@keyframes ambientPulse{
  0%,100%{transform:scale(.92);opacity:.65}
  50%{transform:scale(1.08);opacity:1}
}

@keyframes borderShimmer{
  to{background-position:-240% 0}
}

@keyframes lightSweep{
  0%,18%{left:-58%;opacity:0}
  30%{opacity:1}
  58%{left:120%;opacity:.5}
  100%{left:120%;opacity:0}
}

@keyframes textGoldFlow{
  to{background-position:-220% center}
}

@keyframes buttonGoldFlow{
  to{background-position:-220% 0}
}

@keyframes buttonSweep{
  0%,48%{left:-70%;opacity:0}
  58%{opacity:.85}
  78%{left:145%;opacity:.55}
  100%{left:145%;opacity:0}
}

@keyframes dotPulse{
  0%,100%{transform:scale(.86);opacity:.62}
  50%{transform:scale(1.2);opacity:1}
}

@keyframes floatSpark{
  0%{transform:translate3d(0,0,0) scale(.6);opacity:0}
  16%{opacity:.65}
  72%{opacity:.25}
  100%{transform:translate3d(24px,-260px,0) scale(1.1);opacity:0}
}

@media (max-width:720px){
  .card{padding:32px 22px 28px}
  .logo-orb{
    position:relative;
    inset:auto;
    margin:0 0 34px auto;
    width:72px;
    border-radius:20px;
  }
  h1{font-size:clamp(2.35rem,14vw,4.1rem)}
  .actions{display:grid}
  .lux-button,.ghost{width:100%}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

<body>
  <main class="stage">
    <div class="ambient" aria-hidden="true"></div>

    <section class="card">
      <div class="particles" aria-hidden="true">
        <i class="particle"></i>
        <i class="particle"></i>
        <i class="particle"></i>
        <i class="particle"></i>
        <i class="particle"></i>
      </div>

      <div class="logo-orb" aria-label="Luxury">
        <span>LUX</span>
      </div>

      <div class="kicker">
        <span class="kicker-dot"></span>
        Luxury Motion System
      </div>

      <h1>
        Premium <span class="gold-text">Glow Animation</span>
      </h1>

      <p class="copy">
        Glow yang lembut, berlapis, dan bergerak perlahan. Cahaya tidak berkedip agresif:
        border shimmer, ambient halo, light sweep, gold-flow, dan breathing glow bekerja
        bersamaan untuk menghasilkan kesan premium.
      </p>

      <div class="actions">
        <button class="lux-button" type="button">Mulai Sekarang</button>
        <button class="ghost" type="button">Pelajari Selengkapnya</button>
      </div>
    </section>
  </main>
</body>
</html>
